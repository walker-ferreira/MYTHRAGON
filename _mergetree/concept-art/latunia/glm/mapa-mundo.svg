  <text x="800" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#f2d8a8">ARQUIPÉLAGO DE LATÚNIA — MAPA-MÚNDI</text>
  <text x="800" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#d8b98a">vista aérea em três quartos · norte no alto · rotas de dirigível partem da Vila Central</text>
