    <radialGradient id="fogom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurm" x="-50%" y="-50%" width="200%" height="200%">
