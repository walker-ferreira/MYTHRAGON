  <circle cx="745" cy="925" r="45" fill="url(#lampiao)"/>
  <circle cx="1060" cy="900" r="40" fill="url(#lampiao)"/>
  <circle cx="520" cy="940" r="40" fill="url(#lampiao)"/>

  <!-- legenda -->
  <rect x="0" y="1000" width="1600" height="200" fill="#1d2620" stroke="#8c6a3f" stroke-width="4"/>
  <rect x="24" y="1024" width="1552" height="152" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="1052" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#e3ecd2">LEGENDA — ILHA DA SELVA</text>
  <g font-family="Georgia, serif" font-size="19" fill="#d8e2c8">
    <g transform="translate(80,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">1</text><text x="26" y="7">Doca da Cascata — porto sob a queda d’água</text></g>
    <g transform="translate(80,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">2</text><text x="26" y="7">Grande Estufa — vidro e cobre entre as copas</text></g>
    <g transform="translate(760,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">3</text><text x="26" y="7">Elevador das Copas — hidráulico, do chão à passarela</text></g>
    <g transform="translate(760,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">4</text><text x="26" y="7">Passarela de Cobre — liga estufas e copas</text></g>
    <g transform="translate(1210,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">5</text><text x="26" y="7">Ruínas Hidráulicas — engenhos tomados por raízes</text></g>
    <g transform="translate(1210,1146)"><text y="7" font-size="15" font-style="italic" fill="#b6c49a">Rotas: doca → elevador → estufa → passarela → ruínas.</text></g>
