      <rect x="-34" y="4" width="22" height="14" rx="2"/><rect x="52" y="16" width="22" height="14" rx="2"/>
    </g>
  </g>
  <g transform="translate(240,676)" opacity="0.95">
    <use href="#fabricag" x="0" y="0"/><use href="#sonda" x="40" y="6"/>
