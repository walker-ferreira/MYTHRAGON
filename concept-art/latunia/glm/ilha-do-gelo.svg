  <rect width="1600" height="1200" fill="url(#ceug)"/>
  <rect x="0" y="0" width="1600" height="96" fill="#141a22" opacity="0.6"/>
  <text x="800" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#dbe7f2">ILHA DO GELO — INDÚSTRIA TÉRMICA</text>
  <text x="800" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#a9bccd">Arquipélago de Latúnia · vista aérea em três quartos · norte no alto</text>
  <g transform="translate(1512,150)">
    <path d="M0 -34 L12 18 L0 8 L-12 18 Z" fill="#c9a227" stroke="#2b2724" stroke-width="2"/>
    <text y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#dbe7f2">N</text>
  </g>

  <rect x="0" y="300" width="1600" height="700" fill="url(#marg)"/>
  <g stroke="#4c5c6e" stroke-width="2" opacity="0.5">
    <path d="M70 950 h130 M250 1000 h150 M1180 960 h160 M900 1050 h170 M420 1040 h140"/>
    <path d="M100 1030 h100 M1120 920 h120 M520 1080 h150 M940 930 h120"/>
  </g>

  <!-- neblina fria -->
  <ellipse cx="500" cy="380" rx="420" ry="80" fill="#dfe9f2" opacity="0.30" filter="url(#nevoag)"/>
  <ellipse cx="1150" cy="420" rx="360" ry="70" fill="#dfe9f2" opacity="0.24" filter="url(#nevoag)"/>

  <!-- maciço glacial: platôs e fiordes -->
  <path d="M240 640 L470 560 L700 590 L760 660 L640 700 L380 700 Z" fill="url(#gelog)" stroke="#2b323c" stroke-width="3"/>
  <path d="M240 640 L380 700 L640 700 L760 660 L770 720 L620 770 L360 770 L250 710 Z" fill="#5d6b7a" stroke="#2b323c" stroke-width="3"/>
  <path d="M820 600 L1030 540 L1300 570 L1400 640 L1300 700 L1000 710 L850 680 Z" fill="url(#gelog)" stroke="#2b323c" stroke-width="3"/>
  <path d="M820 600 L850 680 L1000 710 L1300 700 L1400 640 L1410 700 L1290 770 L990 780 L840 730 Z" fill="#5d6b7a" stroke="#2b323c" stroke-width="3"/>
  <!-- fiordes: braços de mar -->
  <path d="M760 660 L770 720 L620 770 L840 730 L760 660 Z" fill="#33404e" stroke="#2b323c" stroke-width="2.5"/>
  <path d="M760 660 L760 620 L790 600 L820 600 L840 680 L770 720 Z" fill="url(#marg)" stroke="#2b323c" stroke-width="2.5"/>
  <!-- terraço costeiro e doca do fiorde -->
  <path d="M250 710 L360 770 L620 770 L840 730 L990 780 L1290 770 L1410 700 L1420 760 L1270 830 L980 840 L830 800 L610 830 L350 830 L260 770 Z" fill="#7e8b94" stroke="#2b323c" stroke-width="3"/>
  <path d="M260 770 L350 830 L610 830 L830 800 L980 840 L1270 830 L1420 760 L1430 820 L1260 890 L970 900 L820 860 L600 890 L340 890 L270 830 Z" fill="#5d6b7a" stroke="#2b323c" stroke-width="3"/>
  <path d="M270 830 L340 890 L600 890 L820 860 L970 900 L1260 890 L1430 820 L1440 880 L1250 950 L960 960 L810 920 L590 950 L330 950 L280 890 Z" fill="#4e5a66" stroke="#2b323c" stroke-width="3"/>

  <!-- DOCA DO FIORDE (1) -->
  <g transform="translate(690,948)">
    <path d="M-200 0 h150 v-14 h-150 Z M30 0 h170 v-14 h-170 Z" fill="#7e8b94" stroke="#2b323c" stroke-width="2.5"/>
    <path d="M-125 0 v90 M115 0 v90 M200 0 v90" stroke="#8c9aa4" stroke-width="4"/>
    <g fill="#4e5a66" stroke="#2b323c" stroke-width="2">
      <rect x="-190" y="-34" width="54" height="24"/><rect x="240" y="-28" width="58" height="24"/>
    </g>
    <path d="M-186 -34 L-160 -48 L-136 -34 Z M244 -28 L270 -40 L294 -28 Z" fill="#aebbc4" stroke="#2b323c" stroke-width="2"/>
    <g stroke="#8c6a3f" stroke-width="5" fill="#2b2724">
      <path d="M-40 0 v-80 l48 24 M-40 -80 h-28"/>
      <path d="M60 0 v-74 l-44 22 M60 -74 h26"/>
    </g>
    <circle cx="-40" cy="-80" r="9" fill="#c9a227" stroke="#2b2724" stroke-width="2"/>
    <circle cx="60" cy="-74" r="9" fill="#c9a227" stroke="#2b2724" stroke-width="2"/>
    <g transform="translate(-160,40)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">1</text></g>
  </g>
  <!-- dirigíveis com gelo nas hélices -->
  <g transform="translate(320,890)">
    <ellipse cx="0" cy="-56" rx="80" ry="27" fill="#5d6b7a" stroke="#2b323c" stroke-width="2.5"/>
    <ellipse cx="0" cy="-56" rx="80" ry="27" fill="#dfe9f2" opacity="0.25"/>
    <path d="M-64 -38 l-14 6 M-52 -32 l-10 8 M52 -32 l10 8 M64 -38 l14 6" stroke="#e8f2f8" stroke-width="3"/>
    <rect x="-16" y="-31" width="32" height="15" fill="#4e5a66" stroke="#2b323c" stroke-width="2"/>
    <path d="M0 -26 v92 M-36 -22 v84 M36 -22 v84" stroke="#8c9aa4" stroke-width="2" opacity="0.8"/>
    <g transform="translate(0,-52)"><path d="M-10 4 L10 4 M-6 -2 L6 -2" stroke="#bfe3ef" stroke-width="2"/></g>
  </g>
  <g transform="translate(1290,905)">
    <ellipse cx="0" cy="-50" rx="68" ry="23" fill="#5d6b7a" stroke="#2b323c" stroke-width="2.5"/>
    <ellipse cx="0" cy="-50" rx="68" ry="23" fill="#dfe9f2" opacity="0.22"/>
    <rect x="-14" y="-28" width="28" height="14" fill="#4e5a66" stroke="#2b323c" stroke-width="2"/>
