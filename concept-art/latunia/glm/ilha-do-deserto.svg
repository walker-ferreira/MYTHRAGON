  <rect x="24" y="1024" width="1552" height="152" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="1052" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f6e2b0">LEGENDA — ILHA DO DESERTO</text>
  <g font-family="Georgia, serif" font-size="19" fill="#e8d5ae">
    <g transform="translate(80,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">1</text><text x="26" y="7">Doca do Deserto — porto entre as dunas</text></g>
    <g transform="translate(80,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">2</text><text x="26" y="7">Mina a Céu Aberto — terraços de escavação</text></g>
    <g transform="translate(620,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">3</text><text x="26" y="7">Espelhos Solares — foco térmico sobre a caldeira</text></g>
    <g transform="translate(620,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">4</text><text x="26" y="7">Aqueduto de Latão — água bombeada às oficinas</text></g>
    <g transform="translate(1170,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">5</text><text x="26" y="7">Posto das Dunas — estação com catavento</text></g>
    <g transform="translate(1170,1146)"><text y="7" font-size="15" font-style="italic" fill="#c9a99a">Rotas: doca → tubos → mina → aqueduto → espelhos.</text></g>
