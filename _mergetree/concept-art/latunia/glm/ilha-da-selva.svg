  <!-- DOCA DA CASCATA (1) -->
  <g transform="translate(760,948)">
    <path d="M-190 0 h140 v-14 h-140 Z M40 0 h160 v-14 h-160 Z" fill="#6e5a44" stroke="#24301f" stroke-width="2.5"/>
    <path d="M-120 0 v84 M120 0 v84 M200 0 v84" stroke="#8c6a3f" stroke-width="4"/>
    <g fill="#5d4a3a" stroke="#24301f" stroke-width="2">
