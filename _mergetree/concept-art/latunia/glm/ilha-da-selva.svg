      <path d="M-18 0 h36 M-18 -22 h36 M-18 -46 h36" stroke="#8c6a3f" stroke-width="3"/>
      <path d="M-18 0 L-18 -70 M18 0 L18 -70" stroke="#5d4a3a" stroke-width="2"/>
