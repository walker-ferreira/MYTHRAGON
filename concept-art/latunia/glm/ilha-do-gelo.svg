      <ellipse cx="108" cy="-62" rx="11" ry="7"/><ellipse cx="116" cy="-82" rx="14" ry="9"/>
    </g>
    <!-- blocos de gelo -->
    <g fill="#bfe3ef" stroke="#5a7d8c" stroke-width="1.5" opacity="0.9">
