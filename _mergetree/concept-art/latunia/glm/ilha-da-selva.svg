    <path d="M700 640 Q690 760 672 900" stroke="#eef8fa" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M1040 660 Q1052 770 1068 905" stroke="#cfe4e8" stroke-width="8" fill="none" opacity="0.8"/>
    <path d="M1040 660 Q1052 770 1068 905" stroke="#eef8fa" stroke-width="3" fill="none" opacity="0.75"/>
    <ellipse cx="672" cy="904" rx="30" ry="10" fill="#dfeef2" opacity="0.5" filter="url(#brilhos)"/>
