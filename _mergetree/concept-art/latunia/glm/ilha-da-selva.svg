      <use href="#arvore" transform="translate(950,590)"/>
      <use href="#arvore" transform="translate(1030,610) scale(1.2)"/>
      <g stroke="#27482a" stroke-width="3" opacity="0.8" fill="none">
        <path d="M640 660 q60 -12 130 -8 M900 655 q70 -10 150 -6 M480 640 q50 -10 110 -6"/>
