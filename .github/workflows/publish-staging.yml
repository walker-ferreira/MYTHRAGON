name: PUBLISH staging experimental
on:
  workflow_run:
    workflows: ['Validar e compilar mapa']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: roblox-staging-135004978091658
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject obsolete candidate before downloading
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$BUILD_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: mythragon-pilot
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify exact CI artifact and manifest
        run: python tools/release.py verify
      - name: Publish (mandatory, never a preview)
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/publish.py
      - name: Inspect exact persisted revision and isolated engine bootstrap
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: python tools/verify_cloud.py
      - name: Release evidence summary
        if: always()
        run: |
          if test -f dist/receipt.json; then
            echo '### Experimental staging receipt (NOT a client playtest)' >> "$GITHUB_STEP_SUMMARY"
            cat dist/receipt.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No confirmed publication receipt. This is NOT a published release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
