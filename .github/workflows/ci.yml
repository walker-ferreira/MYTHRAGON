name: Validar e compilar mapa
on:
  pull_request:
  push:
    branches: [main, 'setup/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_SHA: ${{ github.sha }}
      BUILD_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Install pinned official Luau and Roblox LSP
        run: |
          bash tools/install-luau.sh
          bash tools/install-lsp.sh
      - name: Syntax, standalone unit and contract tests
        run: python tools/validate.py
      - name: Roblox-aware static analysis
        run: python tools/static_gate.py
      - name: Embed build identity
        run: python tools/release.py prepare
      - name: Reproducible Rojo build and source inclusion
        run: |
          rojo --version
          rojo build default.project.json -o dist/mythragon.rbxlx
          rojo build default.project.json -o dist/repro.rbxlx
          cmp dist/mythragon.rbxlx dist/repro.rbxlx
          rm dist/repro.rbxlx
          python tools/release.py manifest
          python tools/release.py verify
      - name: PREVIEW only (no publication)
        run: echo "PREVIEW_OK - build $BUILD_RUN_ID / $BUILD_SHA. Engine/client/visual NOT certified." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mythragon-pilot
          path: dist/
          if-no-files-found: error
          retention-days: 30
