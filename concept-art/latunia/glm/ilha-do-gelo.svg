  <g transform="translate(1120,660)">
    <use href="#sonda" x="-70" y="0"/><use href="#sonda" x="0" y="6"/><use href="#sonda" x="70" y="-2"/>
    <g fill="#5d6672" stroke="#23272e" stroke-width="2">
      <circle cx="-46" cy="34" r="20"/><circle cx="6" cy="40" r="24"/><circle cx="58" cy="32" r="18"/>
    </g>
    <g fill="url(#foguaca)">
      <circle cx="-46" cy="34" r="30"/><circle cx="6" cy="40" r="36"/><circle cx="58" cy="32" r="26"/>
    </g>
    <path d="M-46 34 Q-30 10 -6 40 M6 40 Q26 14 58 32" stroke="#8c6a3f" stroke-width="5" fill="none"/>
    <g transform="translate(6,66)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">3</text></g>
    <g fill="#e8f2f8" filter="url(#brilhog)" opacity="0.8">
      <ellipse cx="0" cy="-84" rx="13" ry="9"/><ellipse cx="8" cy="-106" rx="17" ry="11"/>
      <ellipse cx="-70" cy="-88" rx="11" ry="8"/><ellipse cx="72" cy="-84" rx="11" ry="8"/>
    </g>
  </g>
  <g transform="translate(1330,610)" opacity="0.95">
    <use href="#fabricag" x="0" y="0"/>
    <rect x="20" y="-56" width="9" height="18" fill="#3a4048" stroke="#23272e" stroke-width="1.5"/>
  </g>

