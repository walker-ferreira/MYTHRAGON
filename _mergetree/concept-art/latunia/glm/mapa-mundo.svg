<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="mundoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241e2c"/>
      <stop offset="0.5" stop-color="#5a4238"/>
      <stop offset="1" stop-color="#a87a4a"/>
    </linearGradient>
    <linearGradient id="mundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39354a"/>
      <stop offset="1" stop-color="#262230"/>
    </linearGradient>
    <radialGradient id="lam" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
