name: Validar e compilar mapa
on:
  pull_request:
  push:
    branches: [main, 'setup/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Verificar sintaxe Luau
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip -o "$tmp/luau.zip"
          echo "6506f0852c623aaffcb28494aac16c26dc04a269ea0e16cc0aafc8c8ac79f3ec  $tmp/luau.zip" | sha256sum -c -
          unzip -q "$tmp/luau.zip" -d "$tmp"
          chmod +x "$tmp/luau-compile"
          while IFS= read -r -d '' source; do
            "$tmp/luau-compile" --null "$source"
          done < <(find src -type f \( -name '*.luau' -o -name '*.lua' \) -print0)
      - name: Compilar o mapa
        run: |
          mkdir -p dist
          rojo build default.project.json -o dist/mythragon.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: mythragon-pilot
          path: dist/mythragon.rbxlx
          if-no-files-found: error
