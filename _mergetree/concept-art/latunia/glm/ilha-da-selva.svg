<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="ceus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2622"/>
      <stop offset="0.45" stop-color="#2e4438"/>
      <stop offset="0.8" stop-color="#52705a"/>
      <stop offset="1" stop-color="#7d9471"/>
    </linearGradient>
    <linearGradient id="rios" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4a4e"/>
      <stop offset="1" stop-color="#22383c"/>
    </linearGradient>
    <linearGradient id="copa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e7d4a"/>
      <stop offset="1" stop-color="#2e5232"/>
    </linearGradient>
    <linearGradient id="cobre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4e"/>
      <stop offset="1" stop-color="#6e8a6a"/>
    </linearGradient>
    <radialGradient id="lampiao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </radialGradient>
    <filter id="brilhos" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="nevoas" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <g id="arvore">
      <rect x="-5" y="-30" width="10" height="30" fill="#4a3a30" stroke="#24301f" stroke-width="1.5"/>
      <circle cy="-42" r="20" fill="url(#copa)" stroke="#24301f" stroke-width="1.5"/>
      <circle cx="12" cy="-30" r="13" fill="#3a6540" stroke="#24301f" stroke-width="1.5"/>
      <circle cx="-13" cy="-28" r="12" fill="#2e5232" stroke="#24301f" stroke-width="1.5"/>
    </g>
    <g id="estufa">
      <path d="M-52 0 L-46 -34 Q0 -52 46 -34 L52 0 Z" fill="#3d3a4a" stroke="#241c17" stroke-width="2"/>
      <path d="M-46 -34 Q0 -52 46 -34" fill="none" stroke="#c98a4e" stroke-width="4"/>
      <path d="M-52 0 L-46 -34 Q0 -52 46 -34 L52 0 Z" fill="#f2d98c" opacity="0.35"/>
      <g stroke="#c98a4e" stroke-width="2.5"><path d="M-30 -28 Q0 -42 30 -28 M-15 -22 Q0 -30 15 -22"/></g>
      <path d="M-56 0 h112" stroke="#6e8a6a" stroke-width="4"/>
    </g>
    <g id="torrebaixo">
