    <path d="M-330 40 Q-160 -30 0 -8 Q170 -30 330 34" fill="none" stroke="#8c6a3f" stroke-width="2" opacity="0.8"/>
    <path d="M-300 26 L-300 62 M-240 8 L-240 50 M-170 -2 L-170 44 M-100 -10 L-100 34 M-30 -12 L-30 32 M40 -12 L40 34 M110 -10 L110 38 M180 -2 L180 46 M250 10 L250 56 M310 24 L310 62" stroke="#5d4a3a" stroke-width="3.5"/>
