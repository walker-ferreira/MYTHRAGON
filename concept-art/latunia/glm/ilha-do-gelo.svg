  <!-- FÁBRICA DE GELO (2) -->
  <g transform="translate(420,726)">
    <use href="#fabricag" x="-90" y="4"/><use href="#fabricag" x="0" y="10"/><use href="#fabricag" x="90" y="0"/>
    <g transform="translate(34,40)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">2</text></g>
    <g fill="#e8f2f8" filter="url(#brilhog)" opacity="0.75">
