<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="ceug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2430"/>
      <stop offset="0.6" stop-color="#46506a"/>
      <stop offset="1" stop-color="#8fa3b8"/>
    </linearGradient>
    <linearGradient id="marg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33404e"/>
      <stop offset="1" stop-color="#232c36"/>
    </linearGradient>
    <linearGradient id="gelog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6e2"/>
      <stop offset="1" stop-color="#8ba0b4"/>
    </linearGradient>
    <linearGradient id="tundra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7ad"/>
      <stop offset="1" stop-color="#6e7a80"/>
    </linearGradient>
    <radialGradient id="foguaca" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d4d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </radialGradient>
    <filter id="brilhog" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="nevoag" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <g id="fabricag">
      <rect x="-30" y="-30" width="60" height="30" fill="#5d6672" stroke="#23272e" stroke-width="2"/>
      <path d="M-34 -30 L0 -44 L34 -30 Z" fill="#aebbc4" stroke="#23272e" stroke-width="2"/>
      <rect x="-22" y="-20" width="10" height="10" fill="#ffcf7d" opacity="0.8"/>
      <rect x="8" y="-20" width="10" height="10" fill="#ffcf7d" opacity="0.55"/>
      <rect x="18" y="-56" width="9" height="18" fill="#3a4048" stroke="#23272e" stroke-width="1.5"/>
    </g>
    <g id="sonda">
      <path d="M-16 0 L0 -64 L16 0 Z" fill="#5d6672" stroke="#23272e" stroke-width="2"/>
      <path d="M0 -64 v20 M-10 -22 h20" stroke="#c9a227" stroke-width="3"/>
      <circle cy="-44" r="8" fill="#2b2724" stroke="#c9a227" stroke-width="2.5"/>
    </g>
    <g id="cristal">
      <path d="M0 -26 L8 0 L0 6 L-8 0 Z" fill="#bfe3ef" stroke="#5a7d8c" stroke-width="1.5" opacity="0.9"/>
    </g>
    <g id="cristalg">
      <circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#ffcf7d">N</text>
    </g>
