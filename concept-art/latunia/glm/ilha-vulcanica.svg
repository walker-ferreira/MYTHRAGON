<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="cev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1416"/>
      <stop offset="0.55" stop-color="#4a2620"/>
      <stop offset="1" stop-color="#8a4326"/>
    </linearGradient>
    <linearGradient id="marv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2422"/>
      <stop offset="1" stop-color="#241a18"/>
    </linearGradient>
    <linearGradient id="rochav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a443c"/>
      <stop offset="1" stop-color="#33261f"/>
    </linearGradient>
    <linearGradient id="basalto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a34"/>
      <stop offset="1" stop-color="#2b201c"/>
    </linearGradient>
    <radialGradient id="fogov" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurv" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="nevov" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <g id="fundicao">
      <rect x="-34" y="-46" width="68" height="46" fill="#4a3a34" stroke="#241c17" stroke-width="2"/>
      <path d="M-40 -46 L0 -64 L40 -46 Z" fill="#6f7d7e" stroke="#241c17" stroke-width="2"/>
      <rect x="-24" y="-32" width="12" height="12" fill="#ff9d4d" opacity="0.85"/>
      <rect x="10" y="-32" width="12" height="12" fill="#ffcf7d" opacity="0.6"/>
      <rect x="20" y="-86" width="12" height="26" fill="#33261f" stroke="#241c17" stroke-width="2"/>
      <ellipse cx="26" cy="-96" rx="16" ry="10" fill="#6e5a50" opacity="0.6" filter="url(#blurv)"/>
    </g>
    <g id="caldeira">
      <rect x="-26" y="-34" width="52" height="34" rx="6" fill="#4a3a34" stroke="#241c17" stroke-width="2"/>
      <rect x="-18" y="-24" width="36" height="8" fill="#ff7a3d" opacity="0.8"/>
      <path d="M-30 -34 h60" stroke="#8c6a3f" stroke-width="3"/>
      <rect x="-4" y="-52" width="8" height="14" fill="#33261f" stroke="#241c17" stroke-width="1.5"/>
      <ellipse cx="0" cy="-60" rx="12" ry="8" fill="#6e5a50" opacity="0.55" filter="url(#blurv)"/>
    </g>
    <g id="mnum">
      <circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#ffcf7d">N</text>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#cev)"/>
  <rect x="0" y="0" width="1600" height="96" fill="#150d0d" opacity="0.65"/>
  <text x="800" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#f2c9a8">ILHA VULCÂNICA — FUNDIÇÃO MAGMÁTICA</text>
  <text x="800" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#c99a7a">Arquipélago de Latúnia · vista aérea em três quartos · norte no alto</text>
  <g transform="translate(1512,150)">
    <path d="M0 -34 L12 18 L0 8 L-12 18 Z" fill="#c9a227" stroke="#2b2724" stroke-width="2"/>
    <text y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f2c9a8">N</text>
  </g>

  <rect x="0" y="300" width="1600" height="700" fill="url(#marv)"/>
  <g stroke="#543a34" stroke-width="2" opacity="0.5">
    <path d="M80 950 h130 M260 1000 h150 M1180 960 h160 M900 1050 h170 M420 1040 h140 M120 1030 h100 M1120 920 h120"/>
  </g>
  <ellipse cx="1150" cy="400" rx="380" ry="76" fill="#8a6a5a" opacity="0.30" filter="url(#nevov)"/>
  <ellipse cx="430" cy="420" rx="330" ry="66" fill="#8a6a5a" opacity="0.24" filter="url(#nevov)"/>

  <!-- maciço vulcânico: caldeira e terraços de basalto -->
  <path d="M260 640 L520 550 L820 520 L1080 530 L1240 590 L1330 660 L1180 720 L840 730 L500 715 Z" fill="url(#rochav)" stroke="#241c17" stroke-width="3"/>
  <path d="M260 640 L500 715 L840 730 L1180 720 L1330 660 L1340 720 L1180 790 L830 800 L490 785 L270 710 Z" fill="#3d2e28" stroke="#241c17" stroke-width="3"/>
  <path d="M270 710 L490 785 L830 800 L1180 790 L1340 720 L1350 780 L1170 855 L820 870 L480 850 L280 770 Z" fill="url(#basalto)" stroke="#241c17" stroke-width="3"/>
  <path d="M280 770 L480 850 L820 870 L1170 855 L1350 780 L1360 840 L1160 915 L810 930 L470 910 L290 830 Z" fill="#33261f" stroke="#241c17" stroke-width="3"/>
  <path d="M290 830 L470 910 L810 930 L1160 915 L1360 840 L1370 900 L1150 970 L800 985 L460 965 L300 890 Z" fill="#2b201c" stroke="#241c17" stroke-width="3"/>

  <!-- cratera ativa ao norte -->
  <g transform="translate(820,560)">
    <path d="M-70 10 L-40 -24 L40 -28 L70 6 L40 18 L-40 22 Z" fill="#3d2e28" stroke="#241c17" stroke-width="2.5"/>
    <ellipse cx="0" cy="-6" rx="34" ry="10" fill="url(#fogov)"/>
    <path d="M0 -8 Q-6 40 -30 96 M4 -8 Q10 30 34 88" stroke="#ff7a3d" stroke-width="5" fill="none" opacity="0.95"/>
    <path d="M0 -8 Q-6 40 -30 96 M4 -8 Q10 30 34 88" stroke="#ffcf7d" stroke-width="2" fill="none" opacity="0.7"/>
    <g fill="#8a7a70" filter="url(#blurv)" opacity="0.55">
      <ellipse cx="0" cy="-40" rx="26" ry="13"/><ellipse cx="12" cy="-64" rx="18" ry="11"/>
    </g>
  </g>

  <!-- Fundição Principal (2) -->
  <g transform="translate(1020,690)">
    <use href="#fundicao" x="-100" y="6"/><use href="#fundicao" x="0" y="10"/><use href="#fundicao" x="100" y="2"/>
    <g transform="translate(-40,46)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">2</text></g>
    <path d="M-140 14 h280" stroke="#8c6a3f" stroke-width="5"/>
    <circle cx="-96" cy="-96" r="26" fill="url(#fogov)" opacity="0.6"/>
    <circle cx="4" cy="-98" r="24" fill="url(#fogov)" opacity="0.6"/>
  </g>

  <!-- DOCA VULCÂNICA (1) -->
  <g transform="translate(740,948)">
    <path d="M-190 0 h150 v-14 h-150 Z M40 0 h160 v-14 h-160 Z" fill="#5a443c" stroke="#241c17" stroke-width="2.5"/>
    <path d="M-120 0 v84 M120 0 v84 M200 0 v84" stroke="#8c6a3f" stroke-width="4"/>
    <g fill="#33261f" stroke="#241c17" stroke-width="2">
      <rect x="-180" y="-32" width="52" height="22"/><rect x="250" y="-26" width="56" height="22"/>
    </g>
    <path d="M-176 -32 L-152 -46 L-128 -32 Z M254 -26 L278 -38 L302 -26 Z" fill="#6f7d7e" stroke="#241c17" stroke-width="2"/>
    <g stroke="#8c6a3f" stroke-width="5" fill="#2b2724">
      <path d="M-30 0 v-76 l46 24 M-30 -76 h-26"/>
      <path d="M70 0 v-70 l-42 22 M70 -70 h24"/>
    </g>
    <circle cx="-30" cy="-76" r="9" fill="#c9a227" stroke="#241c17" stroke-width="2"/>
    <circle cx="70" cy="-70" r="9" fill="#c9a227" stroke="#241c17" stroke-width="2"/>
    <g transform="translate(-150,38)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">1</text></g>
  </g>
  <g transform="translate(320,908)">
    <ellipse cx="0" cy="-54" rx="76" ry="25" fill="#4a3a34" stroke="#241c17" stroke-width="2.5"/>
    <ellipse cx="0" cy="-54" rx="76" ry="25" fill="#f2b25c" opacity="0.14"/>
    <rect x="-15" y="-31" width="30" height="15" fill="#33261f" stroke="#241c17" stroke-width="2"/>
    <path d="M0 -25 v88 M-34 -21 v78 M34 -21 v78" stroke="#c9a227" stroke-width="2" opacity="0.8"/>
  </g>
  <g transform="translate(1300,910)">
    <ellipse cx="0" cy="-52" rx="70" ry="24" fill="#4a3a34" stroke="#241c17" stroke-width="2.5"/>
    <ellipse cx="0" cy="-52" rx="70" ry="24" fill="#f2b25c" opacity="0.12"/>
    <rect x="-14" y="-30" width="28" height="14" fill="#33261f" stroke="#241c17" stroke-width="2"/>
    <path d="M0 -24 v84 M-30 -20 v74 M30 -20 v74" stroke="#c9a227" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Caldeiras de Magma (3) -->
  <g transform="translate(1180,610)">
    <use href="#caldeira" x="-80" y="0"/><use href="#caldeira" x="0" y="6"/><use href="#caldeira" x="80" y="-2"/>
    <g fill="url(#fogov)" opacity="0.9">
      <circle cx="-80" cy="24" r="30"/><circle cx="0" cy="30" r="34"/><circle cx="80" cy="22" r="28"/>
    </g>
    <path d="M-80 24 Q-40 4 0 30 M0 30 Q40 8 80 22" stroke="#8c6a3f" stroke-width="5" fill="none"/>
    <g transform="translate(6,60)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">3</text></g>
  </g>

  <!-- Ponte de Ferro (4) -->
  <g transform="translate(640,800)">
    <path d="M-280 4 Q0 -40 280 6" fill="none" stroke="#5d6672" stroke-width="9"/>
    <path d="M-280 4 Q0 -40 280 6" fill="none" stroke="#8c9aa4" stroke-width="2.5" opacity="0.7"/>
    <path d="M-250 6 L-250 30 M-170 -10 L-170 36 M-90 -24 L-90 40 M0 -30 L0 42 M90 -24 L90 40 M170 -10 L170 36 M250 6 L250 30" stroke="#4a3a34" stroke-width="4"/>
    <path d="M-280 4 L0 -30 M-250 30 L0 -30 M-170 36 L0 -30 M-90 40 L0 -30 M0 42 L0 -30 M90 40 L0 -30 M170 36 L0 -30 M250 30 L0 -30 M280 6 L0 -30" stroke="#4a3a34" stroke-width="2.5" opacity="0.85"/>
    <g transform="translate(-140,52)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">4</text></g>
    <path d="M-120 -30 h80 M40 -24 h80" stroke="#c9a227" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Posto da Fenda (5) -->
  <g transform="translate(1240,846)">
    <g fill="#33261f" stroke="#241c17" stroke-width="2">
      <rect x="-70" y="-20" width="44" height="20"/><rect x="-14" y="-16" width="36" height="16"/>
    </g>
    <path d="M-74 -20 L-48 -34 L-22 -20 Z M-18 -16 L4 -28 L26 -16 Z" fill="#6f7d7e" stroke="#241c17" stroke-width="2"/>
    <rect x="-6" y="-44" width="8" height="16" fill="#241c17" stroke="#241c17" stroke-width="1.5"/>
    <ellipse cx="-2" cy="-52" rx="12" ry="8" fill="#6e5a50" opacity="0.5" filter="url(#blurv)"/>
    <path d="M40 -4 Q44 -30 60 -44 M46 2 Q52 -20 68 -32" stroke="#ff7a3d" stroke-width="4" fill="none" opacity="0.9"/>
    <g transform="translate(-92,16)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">5</text></g>
  </g>

  <!-- tubulações e canais de lava -->
  <g stroke="#8c6a3f" stroke-width="4" fill="none" opacity="0.9">
    <path d="M540 800 Q680 838 840 842 M840 842 Q1000 844 1100 826"/>
    <path d="M1130 668 Q1100 720 1060 800"/>
  </g>
  <g stroke="#ff7a3d" stroke-width="5" fill="none" opacity="0.9">
    <path d="M640 856 Q740 884 840 890 M420 830 Q480 856 540 870"/>
  </g>
  <g fill="url(#fogov)">
    <circle cx="640" cy="856" r="26"/><circle cx="840" cy="890" r="30"/><circle cx="420" cy="830" r="24"/>
  </g>

  <g>
    <use href="#lamv" x="0" y="0" width="90" height="90" transform="translate(660,880)"/>
    <use href="#lamv" x="0" y="0" width="80" height="80" transform="translate(1060,860)"/>
  </g>
  <g fill="#ffcf7d" filter="url(#blurv)" opacity="0.5">
    <ellipse cx="950" cy="600" rx="10" ry="6"/><ellipse cx="700" cy="610" rx="9" ry="5"/>
  </g>

  <!-- legenda -->
  <rect x="0" y="1000" width="1600" height="200" fill="#1c1210" stroke="#8c6a3f" stroke-width="4"/>
  <rect x="24" y="1024" width="1552" height="152" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="1052" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f2c9a8">LEGENDA — ILHA VULCÂNICA</text>
  <g font-family="Georgia, serif" font-size="19" fill="#e0c8b0">
    <g transform="translate(80,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">1</text><text x="26" y="7">Doca Vulcânica — porto sobre a baía escura</text></g>
    <g transform="translate(80,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">2</text><text x="26" y="7">Fundição Principal — altos-fornos no terraço</text></g>
    <g transform="translate(620,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">3</text><text x="26" y="7">Caldeiras de Magma — reservas ligadas por tubos</text></g>
    <g transform="translate(620,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">4</text><text x="26" y="7">Ponte de Ferro — atravessa o canal de lava</text></g>
    <g transform="translate(1170,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">5</text><text x="26" y="7">Posto da Fenda — estação junto às fumarolas</text></g>
    <g transform="translate(1170,1146)"><text y="7" font-size="15" font-style="italic" fill="#c99a7a">Rotas: doca → canais/ponte → fundição → caldeiras → posto.</text></g>
  </g>
</svg>
