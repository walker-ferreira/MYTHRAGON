  <rect width="1600" height="1200" fill="url(#ceus)"/>
  <rect x="0" y="0" width="1600" height="96" fill="#16211a" opacity="0.6"/>
  <text x="800" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#e3ecd2">ILHA DA SELVA — ENGENHARIA BOTÂNICA</text>
  <text x="800" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#b6c49a">Arquipélago de Latúnia · vista aérea em três quartos · norte no alto</text>
  <g transform="translate(1512,150)">
    <path d="M0 -34 L12 18 L0 8 L-12 18 Z" fill="#c9a227" stroke="#2b2724" stroke-width="2"/>
    <text y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#e3ecd2">N</text>
  </g>

  <rect x="0" y="300" width="1600" height="700" fill="url(#rios)"/>
  <g stroke="#3d5a5c" stroke-width="2" opacity="0.5">
