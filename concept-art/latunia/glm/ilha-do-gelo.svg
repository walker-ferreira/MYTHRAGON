  <g transform="translate(640,800)">
    <path d="M-260 0 Q0 -44 260 0" fill="none" stroke="#8c9aa4" stroke-width="8"/>
    <path d="M-260 0 Q0 -44 260 0" fill="none" stroke="#dfe9f2" stroke-width="3" opacity="0.8"/>
    <path d="M-230 -6 L-230 18 M-150 -16 L-150 26 M-70 -26 L-70 30 M10 -30 L10 32 M90 -28 L90 30 M170 -20 L170 28 M250 -8 L250 20" stroke="#5d6b7a" stroke-width="3.5"/>
    <path d="M-260 0 L10 -32 M-230 18 L10 -32 M-150 26 L10 -32 M-70 30 L10 -32 M90 30 L10 -32 M170 28 L10 -32 M250 20 L10 -32" stroke="#5d6b7a" stroke-width="2" opacity="0.8"/>
    <g transform="translate(-120,44)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">4</text></g>
    <g stroke="#bfe3ef" stroke-width="2" opacity="0.9">
      <path d="M-180 -12 l8 8 M-60 -26 l8 8 M60 -28 l8 8 M180 -14 l8 8"/>
    </g>
  </g>

  <!-- POSTO DA GELEIRA (5) -->
  <g transform="translate(1240,846)">
    <g fill="#4e5a66" stroke="#2b323c" stroke-width="2">
      <rect x="-70" y="-20" width="44" height="20"/><rect x="-14" y="-16" width="36" height="16"/>
    </g>
    <path d="M-74 -20 L-48 -34 L-22 -20 Z M-18 -16 L4 -28 L26 -16 Z" fill="#aebbc4" stroke="#2b323c" stroke-width="2"/>
    <rect x="-4" y="-44" width="8" height="14" fill="#3a4048" stroke="#23272e" stroke-width="1.5"/>
    <ellipse cx="0" cy="-52" rx="12" ry="8" fill="#e8f2f8" opacity="0.6" filter="url(#brilhog)"/>
    <use href="#cristal" x="34" y="-4"/><use href="#cristal" x="44" y="-8"/>
    <g transform="translate(-90,16)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">5</text></g>
  </g>
  <g transform="translate(1120,742)" opacity="0.9">
    <use href="#fabricag" x="0" y="0"/>
  </g>

  <!-- tubulações -->
  <g stroke="#8c6a3f" stroke-width="4" fill="none" opacity="0.9">
    <path d="M420 780 Q560 810 660 812 M500 792 Q760 820 980 812 M980 812 Q1120 806 1240 828"/>
    <path d="M1120 700 Q1080 740 1000 780 M1160 706 Q1220 750 1250 820"/>
  </g>
  <g stroke="#c9a227" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M420 774 Q560 804 660 806 M500 786 Q760 814 980 806 M980 806 Q1120 800 1240 822"/>
  </g>

  <!-- lampiões -->
  <g>
    <circle cx="685" cy="925" r="45" fill="url(#lampg)"/>
    <circle cx="1140" cy="870" r="40" fill="url(#lampg)"/>
    <circle cx="440" cy="890" r="40" fill="url(#lampg)"/>
  </g>
  <!-- vapor branco legível -->
  <g fill="#eef4f8" filter="url(#brilhog)" opacity="0.55">
    <ellipse cx="700" cy="720" rx="18" ry="10"/><ellipse cx="1050" cy="730" rx="16" ry="9"/>
    <ellipse cx="1260" cy="800" rx="12" ry="8"/>
  </g>

  <!-- legenda -->
  <rect x="0" y="1000" width="1600" height="200" fill="#1a2027" stroke="#8c6a3f" stroke-width="4"/>
  <rect x="24" y="1024" width="1552" height="152" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="1052" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#dbe7f2">LEGENDA — ILHA DO GELO</text>
  <g font-family="Georgia, serif" font-size="19" fill="#d5e0ea">
    <g transform="translate(80,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">1</text><text x="26" y="7">Doca do Fiorde — porto congelado com guindastes</text></g>
    <g transform="translate(80,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">2</text><text x="26" y="7">Fábrica de Gelo — serras e blocos na tundra</text></g>
    <g transform="translate(760,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">3</text><text x="26" y="7">Caldeiras Geotérmicas — perfuradoras no platô</text></g>
    <g transform="translate(760,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">4</text><text x="26" y="7">Ponte Congelada — atravessa o fiorde</text></g>
    <g transform="translate(1210,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">5</text><text x="26" y="7">Posto da Geleira — estação avançada</text></g>
    <g transform="translate(1210,1146)"><text y="7" font-size="15" font-style="italic" fill="#a9bccd">Rotas: doca → ponte → fábrica → caldeiras → posto.</text></g>
  </g>
</svg>
