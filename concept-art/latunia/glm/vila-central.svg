<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2436"/>
      <stop offset="0.55" stop-color="#6e4a3a"/>
      <stop offset="1" stop-color="#c98d4e"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a4a"/>
      <stop offset="1" stop-color="#23212c"/>
    </linearGradient>
    <linearGradient id="rocha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a43"/>
      <stop offset="1" stop-color="#3c2f28"/>
    </linearGradient>
    <linearGradient id="topo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a4c"/>
      <stop offset="1" stop-color="#5d4a3a"/>
    </linearGradient>
    <radialGradient id="lampiao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vidroambar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b25c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c98d4e" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="nevoa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="casa">
      <rect x="-14" y="-22" width="28" height="22" fill="#4a3a30" stroke="#2b221c" stroke-width="1.5"/>
      <path d="M-18 -22 L0 -34 L18 -22 Z" fill="#7e8b8c" stroke="#2b221c" stroke-width="1.5"/>
      <rect x="-4" y="-16" width="8" height="9" fill="#e8a33d" opacity="0.75"/>
    </g>
    <g id="oficina">
      <rect x="-20" y="-26" width="40" height="26" fill="#54423a" stroke="#2b221c" stroke-width="1.5"/>
      <path d="M-24 -26 L0 -40 L24 -26 Z" fill="#6f7d7e" stroke="#2b221c" stroke-width="1.5"/>
      <rect x="-14" y="-18" width="9" height="10" fill="#f2b25c" opacity="0.7"/>
      <rect x="6" y="-18" width="9" height="10" fill="#f2b25c" opacity="0.55"/>
      <rect x="-4" y="-52" width="7" height="16" fill="#3a2f28" stroke="#241c17" stroke-width="1.5"/>
    </g>
    <g id="chamine">
      <rect x="-6" y="-46" width="12" height="46" fill="#4a3a30" stroke="#241c17" stroke-width="1.5"/>
      <rect x="-8" y="-50" width="16" height="6" fill="#8c6a3f" stroke="#241c17" stroke-width="1"/>
      <ellipse cx="0" cy="-58" rx="14" ry="9" fill="#e8dcc8" opacity="0.45" filter="url(#brilho)"/>
    </g>
    <g id="engrenagem">
      <circle r="16" fill="none" stroke="#c9a227" stroke-width="5" stroke-dasharray="7 6"/>
      <circle r="7" fill="#8c6a3f" stroke="#c9a227" stroke-width="2"/>
    </g>
    <g id="marcador">
      <circle r="15" fill="#2b2724" stroke="#c9a227" stroke-width="3"/>
      <text y="6" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#ffcf7d">N</text>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#ceu)"/>
  <!-- título -->
  <rect x="0" y="0" width="1600" height="96" fill="#1e1922" opacity="0.55"/>
  <text x="800" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#f2d8a8">VILA CENTRAL — HUB COMERCIAL</text>
  <text x="800" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#d8b98a">Arquipélago de Latúnia · vista aérea em três quartos · norte no alto</text>
  <!-- norte -->
  <g transform="translate(1512,150)">
    <path d="M0 -34 L12 18 L0 8 L-12 18 Z" fill="#c9a227" stroke="#2b2724" stroke-width="2"/>
    <text y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f2d8a8">N</text>
  </g>

  <!-- mar -->
  <rect x="0" y="300" width="1600" height="700" fill="url(#mar)"/>
  <g stroke="#5a5468" stroke-width="2" opacity="0.5">
    <path d="M60 960 h120 M240 1000 h160 M1200 980 h150 M1000 1060 h180 M420 1050 h140 M1350 1030 h120"/>
    <path d="M80 1040 h90 M1140 930 h110 M520 1090 h160 M960 940 h120"/>
  </g>

  <!-- neblina de fundo -->
  <ellipse cx="800" cy="360" rx="700" ry="90" fill="#d8c9b8" opacity="0.28" filter="url(#nevoa)"/>

  <!-- ilha: platô alto -->
  <path d="M330 620 L520 560 L880 540 L1180 570 L1290 640 L1180 700 L840 720 L520 700 Z" fill="url(#topo)" stroke="#2b221c" stroke-width="3"/>
  <!-- falésia média -->
  <path d="M330 620 L520 700 L840 720 L1180 700 L1290 640 L1300 700 L1170 780 L830 800 L500 780 L340 700 Z" fill="url(#rocha)" stroke="#2b221c" stroke-width="3"/>
  <!-- terraço médio -->
  <path d="M340 700 L500 780 L830 800 L1170 780 L1300 700 L1310 760 L1160 850 L820 870 L480 850 L350 770 Z" fill="#6a5340" stroke="#2b221c" stroke-width="3"/>
  <!-- falésia baixa -->
  <path d="M350 770 L480 850 L820 870 L1160 850 L1310 760 L1320 820 L1150 910 L810 930 L460 910 L360 840 Z" fill="url(#rocha)" stroke="#2b221c" stroke-width="3"/>
  <!-- baía/docas -->
  <path d="M360 840 L460 910 L810 930 L1150 910 L1320 820 L1330 880 L1140 970 L800 990 L450 970 L370 900 Z" fill="#57452f" stroke="#2b221c" stroke-width="3"/>
  <path d="M370 900 L450 970 L800 990 L1140 970 L1330 880 L1340 930 L1130 1020 L790 1040 L440 1020 L380 950 Z" fill="#4e3d2a" stroke="#2b221c" stroke-width="3"/>

  <!-- PRAÇA DA TORRE-RELÓGIO (3) -->
  <ellipse cx="800" cy="600" rx="150" ry="58" fill="#7a6248" stroke="#2b221c" stroke-width="2.5"/>
  <ellipse cx="800" cy="600" rx="110" ry="42" fill="#8a7050" stroke="#2b221c" stroke-width="2"/>
  <g transform="translate(800,520)">
    <rect x="-22" y="-120" width="44" height="120" fill="#54423a" stroke="#241c17" stroke-width="2.5"/>
    <rect x="-30" y="-132" width="60" height="14" fill="#8c6a3f" stroke="#241c17" stroke-width="2"/>
    <circle cy="-80" r="17" fill="#f2e3c2" stroke="#241c17" stroke-width="2.5"/>
    <path d="M0 -80 L0 -91 M0 -80 L9 -76" stroke="#3a2f28" stroke-width="2.5"/>
    <path d="M-26 -120 L0 -142 L26 -120 Z" fill="#8c6a3f" stroke="#241c17" stroke-width="2.5"/>
    <circle cy="-146" r="7" fill="#c9a227" stroke="#241c17" stroke-width="2"/>
    <circle cx="45" cy="-125" r="45" fill="url(#lampiao)"/>
  </g>
  <g fill="#4a3a30" stroke="#2b221c" stroke-width="1.5">
    <rect x="700" y="590" width="34" height="24"/><rect x="744" y="598" width="30" height="20"/>
    <rect x="866" y="594" width="32" height="22"/><rect x="908" y="602" width="28" height="18"/>
  </g>
  <path d="M696 590 L717 578 L738 590 Z M740 598 L759 588 L778 598 Z M862 594 L882 584 L902 594 Z M904 602 L922 592 L940 602 Z" fill="#7e8b8c" stroke="#2b221c" stroke-width="1.5"/>
  <g transform="translate(940,610)"><circle r="15" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#ffcf7d">3</text></g>
  <circle cx="800" cy="640" r="75" fill="url(#lampiao)"/>

  <!-- MERCADO DE FERRO E VIDRO (2) -->
  <g transform="translate(560,742)">
    <path d="M-120 0 L-110 -46 Q0 -86 110 -46 L120 0 Z" fill="#3d3a4a" stroke="#241c17" stroke-width="2.5"/>
    <path d="M-110 -46 Q0 -86 110 -46" fill="none" stroke="#8c6a3f" stroke-width="5"/>
    <g stroke="#8c6a3f" stroke-width="3">
      <path d="M-88 -40 Q0 -72 88 -40 M-66 -34 Q0 -58 66 -34 M-44 -28 Q0 -46 44 -28"/>
    </g>
    <path d="M-120 0 L-110 -46 Q0 -86 110 -46 L120 0 Z" fill="#f2b25c" opacity="0.30"/>
    <rect x="-96" y="-14" width="192" height="14" fill="#54423a" stroke="#241c17" stroke-width="2"/>
    <g fill="#ffcf7d" opacity="0.8">
      <rect x="-70" y="-20" width="24" height="8"/><rect x="-20" y="-20" width="24" height="8"/><rect x="30" y="-20" width="24" height="8"/>
    </g>
    <g transform="translate(-100,10)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">2</text></g>
  </g>
  <g transform="translate(545,700)" opacity="0.85"><use href="#engrenagem"/><circle r="26" fill="none" stroke="#8c6a3f" stroke-width="4" stroke-dasharray="10 7"/></g>

  <!-- BAIRRO DAS OFICINAS (5) -->
  <g transform="translate(960,806)">
    <use href="#oficina" x="-80" y="0"/><use href="#oficina" x="0" y="6"/><use href="#oficina" x="80" y="-4"/>
    <use href="#chamine" x="-96" y="0"/><use href="#chamine" x="-14" y="8"/><use href="#chamine" x="70" y="-4"/>
    <use href="#casa" x="-128" y="10"/><use href="#casa" x="130" y="8"/>
    <g transform="translate(38,26)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">5</text></g>
  </g>
  <g transform="translate(700,808)" opacity="0.9">
    <use href="#oficina" x="0" y="0"/><use href="#chamine" x="18" y="2"/>
  </g>
  <g transform="translate(1090,690)" opacity="0.9">
    <use href="#casa" x="0" y="0"/><use href="#casa" x="36" y="6"/><use href="#chamine" x="18" y="4"/>
  </g>

  <!-- ELEVADORES A VAPOR (4) -->
  <g transform="translate(660,690)">
    <rect x="-14" y="0" width="28" height="130" fill="#3a2f28" stroke="#241c17" stroke-width="2.5"/>
    <rect x="-8" y="8" width="16" height="26" fill="#c9a227" opacity="0.9"/>
    <path d="M-14 0 L0 -18 L14 0 Z" fill="#8c6a3f" stroke="#241c17" stroke-width="2"/>
    <path d="M-18 12 L18 12 M-18 60 L18 60 M-18 108 L18 108" stroke="#c9a227" stroke-width="2" opacity="0.7"/>
    <circle cy="30" r="10" fill="#2b2724" stroke="#c9a227" stroke-width="3"/>
    <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#ffcf7d">4</text>
  </g>
  <g transform="translate(1020,700)">
    <rect x="-14" y="0" width="28" height="120" fill="#3a2f28" stroke="#241c17" stroke-width="2.5"/>
    <rect x="-8" y="10" width="16" height="24" fill="#c9a227" opacity="0.9"/>
    <path d="M-14 0 L0 -18 L14 0 Z" fill="#8c6a3f" stroke="#241c17" stroke-width="2"/>
    <path d="M-18 14 L18 14 M-18 62 L18 62 M-18 104 L18 104" stroke="#c9a227" stroke-width="2" opacity="0.7"/>
  </g>
  <path d="M660 824 L660 690 M1020 822 L1020 700" stroke="#2b2724" stroke-width="3" opacity="0.6"/>

  <!-- ESCADARIAS -->
  <g stroke="#c9a227" stroke-width="3.5" fill="none" opacity="0.95">
    <path d="M560 800 L540 816 L552 830 L532 846 L544 860 L524 876 L536 890 L516 906"/>
    <path d="M900 796 L918 812 L906 826 L926 840 L914 856 L934 870 L922 884 L942 900"/>
  </g>
  <g stroke="#241c17" stroke-width="1.4" opacity="0.8">
    <path d="M552 806 h16 M536 838 h16 M520 870 h16 M504 902 h16 M910 806 h16 M918 838 h16 M918 870 h16 M934 902 h16"/>
  </g>

  <!-- DOCAS DA VILA (1) -->
  <g transform="translate(800,986)">
    <path d="M-260 0 h180 v-16 h-180 Z M-40 0 h160 v-16 h-160 Z M160 0 h200 v-16 h-200 Z" fill="#6a5340" stroke="#2b221c" stroke-width="2.5"/>
    <path d="M-80 0 v96 M160 0 v96 M360 0 v96 M-260 0 v80" stroke="#8c6a3f" stroke-width="4"/>
    <g fill="#4e3d2a" stroke="#2b221c" stroke-width="2">
      <rect x="-240" y="-38" width="52" height="26"/><rect x="430" y="-30" width="56" height="26"/>
    </g>
    <path d="M-244 -38 L-214 -52 L-184 -38 Z M434 -30 L458 -42 L482 -30 Z" fill="#6f7d7e" stroke="#2b221c" stroke-width="2"/>
    <!-- guindastes -->
    <g stroke="#8c6a3f" stroke-width="5" fill="#2b2724">
      <path d="M-20 0 v-84 l54 26 M-20 -84 h-30"/>
      <path d="M410 0 v-78 l-50 24 M410 -78 h28"/>
    </g>
    <circle cx="-20" cy="-84" r="9" fill="#c9a227" stroke="#241c17" stroke-width="2"/>
    <circle cx="410" cy="-78" r="9" fill="#c9a227" stroke="#241c17" stroke-width="2"/>
    <g transform="translate(-150,42)"><circle r="13" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcf7d">1</text></g>
  </g>
  <!-- dirigíveis atracados -->
  <g transform="translate(300,900)">
    <ellipse cx="0" cy="-60" rx="86" ry="30" fill="#7a5a43" stroke="#2b221c" stroke-width="2.5"/>
    <ellipse cx="0" cy="-60" rx="86" ry="30" fill="#f2b25c" opacity="0.18"/>
    <path d="M-86 -60 q-18 -6 -26 -18 M86 -60 q18 -6 26 -18" stroke="#c9a227" stroke-width="3" fill="none"/>
    <rect x="-18" y="-34" width="36" height="18" fill="#4e3d2a" stroke="#2b221c" stroke-width="2"/>
    <path d="M-60 -38 L-86 -20 M60 -38 L86 -20" stroke="#c9a227" stroke-width="2.5"/>
    <path d="M0 -30 v108 M-40 -26 v96 M40 -26 v96" stroke="#c9a227" stroke-width="2" opacity="0.75"/>
    <circle cx="0" cy="-60" r="10" fill="url(#vidroambar)"/>
  </g>
  <g transform="translate(1290,930)">
    <ellipse cx="0" cy="-54" rx="74" ry="26" fill="#7a5a43" stroke="#2b221c" stroke-width="2.5"/>
    <ellipse cx="0" cy="-54" rx="74" ry="26" fill="#f2b25c" opacity="0.16"/>
    <rect x="-15" y="-31" width="30" height="15" fill="#4e3d2a" stroke="#2b221c" stroke-width="2"/>
    <path d="M0 -26 v92 M34 -22 v84 M-34 -22 v84" stroke="#c9a227" stroke-width="2" opacity="0.75"/>
  </g>
  <g transform="translate(800,900)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="#e8dcc8" filter="url(#nevoa)"/>
  </g>

  <!-- lampiões das ruas -->
  <g>
    <circle cx="645" cy="905" r="45" fill="url(#lampiao)"/>
    <circle cx="1045" cy="905" r="45" fill="url(#lampiao)"/>
    <circle cx="470" cy="980" r="40" fill="url(#lampiao)"/>
    <circle cx="1210" cy="970" r="40" fill="url(#lampiao)"/>
  </g>

  <!-- vapor da vila -->
  <g fill="#e8dcc8" filter="url(#brilho)" opacity="0.5">
    <ellipse cx="952" cy="742" rx="12" ry="8"/><ellipse cx="958" cy="724" rx="16" ry="10"/>
    <ellipse cx="686" cy="752" rx="12" ry="8"/><ellipse cx="692" cy="734" rx="15" ry="9"/>
    <ellipse cx="1108" cy="676" rx="10" ry="7"/>
  </g>

  <!-- legenda na margem -->
  <rect x="0" y="1000" width="1600" height="200" fill="#241d1e" stroke="#8c6a3f" stroke-width="4"/>
  <rect x="24" y="1024" width="1552" height="152" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="1052" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f2d8a8">LEGENDA — VILA CENTRAL</text>
  <g font-family="Georgia, serif" font-size="19" fill="#e8d5ae">
    <g transform="translate(80,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">1</text><text x="26" y="7">Docas da Vila — porto, guindastes e dirigíveis</text></g>
    <g transform="translate(80,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">2</text><text x="26" y="7">Mercado de Ferro e Vidro — cobertura fosca sobre o terraço médio</text></g>
    <g transform="translate(760,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">3</text><text x="26" y="7">Praça da Torre-Relógio — cume da vila</text></g>
    <g transform="translate(760,1146)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">4</text><text x="26" y="7">Elevador a Vapor — liga docas, oficinas e praça</text></g>
    <g transform="translate(1210,1096)"><circle r="14" fill="#2b2724" stroke="#c9a227" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffcf7d">5</text><text x="26" y="7">Bairro das Oficinas — nível intermediário</text></g>
    <g transform="translate(1210,1146)"><text y="7" font-size="15" font-style="italic" fill="#c9a99a">Rotas: docas → escadas/elevador → oficinas → praça.</text></g>
  </g>
</svg>
